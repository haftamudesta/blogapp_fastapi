{% extends "layout.html" %}
{% block content %}
<div id="postsContainer">
    {% for post in posts %}
    <article class="content-section py-3 px-4 mb-4" data-post-id="{{ post.id }}">
        <div class="d-flex align-items-start gap-4">
            <img class="rounded-circle article-img flex-shrink-0" src="{{ post.author.image_path }}"
                alt="{{ post.author.username }}'s profile picture" width="64" height="64" loading="lazy">
            <div class="flex-grow-1">
                <div class="article-metadata mb-2">
                    <a class="me-2" href="{{ url_for('user_posts', user_id=post.author.id) }}">{{ post.author.username
                        }}</a>
                    <small class="text-body-secondary">{{ post.date_posted.strftime("%B %d, %Y") }}</small>
                </div>
                <h2>
                    <a class="article-title" href="{{ url_for('post_page', post_id=post.id) }}">{{ post.title }}</a>
                </h2>
                <p class="article-content">{{ post.content }}</p>
                <div class="like-section d-flex align-items-center gap-2">
                    <button class="like-btn btn btn-sm btn-outline-danger" data-post-id="{{ post.id }}"
                        data-liked="{{ 'true' if post.is_liked_by_current_user else 'false' }}">
                        <span class="like-icon">{% if post.is_liked_by_current_user %}❤️{% else %}🤍{% endif %}</span>
                        <span class="like-count">{{ post.likes_count }}</span>
                    </button>
                    <span class="text-muted small">likes</span>
                </div>
            </div>
        </div>
    </article>
    {% endfor %}
</div>
{% if has_more %}
<div class="text-center mb-4">
    <button type="button" class="btn btn-outline-primary" id="loadMoreBtn">Load More Posts</button>
</div>
{% endif %}
{% endblock content %}

{% block scripts %}
<script type="module">
    import { getToken } from '/static/js/auth.js';
    import { showModal } from '/static/js/utils.js';

    // Like functionality
    async function handleLike(postId, button) {
        const token = getToken();

        if (!token) {
            window.location.href = '/login';
            return;
        }

        const isLiked = button.getAttribute('data-liked') === 'true';
        const method = isLiked ? 'DELETE' : 'POST';
        const url = `/api/posts/${postId}/like`;

        try {
            const response = await fetch(url, {
                method: method,
                headers: {
                    'Authorization': `Bearer ${token}`,
                },
            });

            if (response.status === 401) {
                window.location.href = '/login';
                return;
            }

            if (response.ok) {
                const data = await response.json();

                // Update button state
                const newLiked = !isLiked;
                button.setAttribute('data-liked', newLiked.toString());

                // Update icon
                const iconSpan = button.querySelector('.like-icon');
                iconSpan.textContent = newLiked ? '❤️' : '🤍';

                // Update count
                const countSpan = button.querySelector('.like-count');
                countSpan.textContent = data.likes_count;

                // Add/remove liked class
                if (newLiked) {
                    button.classList.add('liked');
                } else {
                    button.classList.remove('liked');
                }
            } else if (response.status === 400) {
                const error = await response.json();
                console.error('Like error:', error.detail);
            } else {
                throw new Error('Failed to process like');
            }
        } catch (error) {
            console.error('Error:', error);
            document.getElementById('errorMessage').textContent =
                'Failed to process like. Please try again.';
            showModal('errorModal');
        }
    }

    // Attach event listeners to all like buttons
    function attachLikeListeners() {
        const likeButtons = document.querySelectorAll('.like-btn');
        likeButtons.forEach(button => {
            // Remove existing listener to avoid duplicates
            button.removeEventListener('click', likeClickHandler);
            button.addEventListener('click', likeClickHandler);
        });
    }

    function likeClickHandler(event) {
        event.preventDefault();
        const button = event.currentTarget;
        const postId = parseInt(button.getAttribute('data-post-id'));
        handleLike(postId, button);
    }

    // Initial attachment
    attachLikeListeners();

    // Pagination state
    let currentOffset = {{ limit }};
    const limit = {{ limit }};
    let hasMore = {{ 'true' if has_more else 'false' }};

    const postsContainer = document.getElementById('postsContainer');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    function createPostHTML(post) {
        const isLiked = post.is_liked_by_current_user || false;
        const likeIcon = isLiked ? '❤️' : '🤍';

        return `
            <article class="content-section py-3 px-4 mb-4" data-post-id="${post.id}">
                <div class="d-flex align-items-start gap-4">
                    <img class="rounded-circle article-img flex-shrink-0" src="${escapeHtml(post.author.image_path)}" 
                         alt="${escapeHtml(post.author.username)}'s profile picture" width="64" height="64" loading="lazy">
                    <div class="flex-grow-1">
                        <div class="article-metadata mb-2">
                            <a class="me-2" href="/users/${post.author.id}/posts">${escapeHtml(post.author.username)}</a>
                            <small class="text-body-secondary">${formatDate(post.date_posted)}</small>
                        </div>
                        <h2>
                            <a class="article-title" href="/posts/${post.id}">${escapeHtml(post.title)}</a>
                        </h2>
                        <p class="article-content">${escapeHtml(post.content)}</p>
                        <div class="like-section d-flex align-items-center gap-2">
                            <button class="like-btn btn btn-sm btn-outline-danger" data-post-id="${post.id}" 
                                    data-liked="${isLiked}">
                                <span class="like-icon">${likeIcon}</span>
                                <span class="like-count">${post.likes_count || 0}</span>
                            </button>
                            <span class="text-muted small">likes</span>
                        </div>
                    </div>
                </div>
            </article>
        `;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function (m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function formatDate(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
    }

    async function loadMorePosts() {
        if (!hasMore) return;

        loadMoreBtn.disabled = true;
        loadMoreBtn.textContent = 'Loading...';

        try {
            const token = getToken();
            const headers = {};
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch(`/api/posts?skip=${currentOffset}&limit=${limit}`, { headers });

            if (!response.ok) {
                throw new Error('Failed to fetch posts');
            }

            const data = await response.json();

            for (const post of data.posts) {
                postsContainer.insertAdjacentHTML('beforeend', createPostHTML(post));
            }

            currentOffset += data.posts.length;
            hasMore = data.has_more;

            if (!hasMore && loadMoreBtn) {
                loadMoreBtn.classList.add('d-none');
            }

            // Attach event listeners to new like buttons
            attachLikeListeners();

        } catch (error) {
            console.error('Error loading posts:', error);
            loadMoreBtn.textContent = 'Error - Click to Retry';
            loadMoreBtn.disabled = false;
            return;
        }

        if (hasMore) {
            loadMoreBtn.disabled = false;
            loadMoreBtn.textContent = 'Load More Posts';
        }
    }

    if (loadMoreBtn) {
        loadMoreBtn.addEventListener('click', loadMorePosts);
    }
</script>
{% endblock scripts %}
